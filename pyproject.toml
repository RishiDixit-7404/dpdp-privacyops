[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpdp-privacyops-scanner"
version = "0.1.0"
description = "Local PII discovery scanner for India-first DPDP PrivacyOps workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0",
  "pandas>=2.0.0",
  "psycopg[binary]>=3.1.0",
]

[project.optional-dependencies]
dev = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
dpdp-scanner = "dpdp_scanner.cli:app"

[tool.setuptools]
package-dir = {"" = "scanner"}

[tool.setuptools.packages.find]
where = ["scanner"]
include = ["dpdp_scanner*"]

[tool.pytest.ini_options]
testpaths = ["scanner/tests", "backend/app/tests"]
pythonpath = ["scanner", "backend"]
